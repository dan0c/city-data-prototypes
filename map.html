<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flood Risk Prototype – City Data Prototypes</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <script src="config.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        background-color: #1a2e28;
        color: #ffffff;
        padding: 0 1.5rem;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 1rem;
        height: 56px;
      }

      .back-link {
        color: #9aada9;
        text-decoration: none;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.3rem;
        transition: color 0.15s;
      }

      .back-link:hover { color: #ffffff; }

      .divider {
        color: #3d5a54;
        font-size: 1rem;
      }

      h1 {
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
      }

      #map { flex: 1; }
    </style>
  </head>
  <body>

    <header>
      <a href="index.html" class="back-link">← City Data Prototypes</a>
      <span class="divider">/</span>
      <h1>Flood Risk Prototype</h1>
    </header>

    <div id="map"></div>

    <script>
      mapboxgl.accessToken = window.MAPBOX_TOKEN;

      const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [-90.0715, 29.9511], // New Orleans
        zoom: 11
      });

      map.addControl(new mapboxgl.NavigationControl(), 'top-right');

      map.on('load', () => {
        map.addSource('fema-flood-zones', {
          type: 'geojson',
          data: '/data/flood-zones.geojson',
          attribution: 'FEMA National Flood Hazard Layer'
        });

        map.addLayer({
          id: 'flood-zones-fill',
          type: 'fill',
          source: 'fema-flood-zones',
          paint: {
            'fill-color': [
              'match', ['get', 'FLD_ZONE'],
              'VE', '#d7191c',
              'AE', '#e8602c',
              'AO', '#f5a142',
              'AH', '#f5a142',
              'A',  '#f5c842',
              '#f5c842'
            ],
            'fill-opacity': 0.5
          }
        });

        map.addLayer({
          id: 'flood-zones-outline',
          type: 'line',
          source: 'fema-flood-zones',
          paint: {
            'line-color': '#c0390b',
            'line-width': 0.5,
            'line-opacity': 0.6
          }
        });
      });
    </script>

  </body>
</html>
